name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . "ruff==0.16.10" "mypy==2.4.0" pytest
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy --strict src
      - name: Test
        # The suite builds synthetic databases under the test tmp dir; it never
        # opens a real ~/Library/Messages/chat.db and passes on a machine without one.
        run: pytest -q

  package:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Smoke-install the wheel
        run: python -m pip install dist/*.whl && python -c "import imessage_chatdb as m; print(m.__version__)" && python -m imessage_chatdb --help
